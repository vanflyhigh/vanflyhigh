# Admin dashboard settings (Sveltia CMS). Open /admin/ on the live site to use it.
# You sign in with a GitHub access token (see README.md). Only a token with
# write access to this repository can sign in, so you are the only admin.

backend:
  name: github
  repo: vanflyhigh/vanflyhigh
  branch: main
  # Token sign-in works on GitHub Pages without any extra login server.
  auth_methods: [token]
  commit_messages:
    create: "Add {{collection}}: {{slug}}"
    update: "Update {{collection}}: {{slug}}"
    delete: "Delete {{collection}}: {{slug}}"
    uploadMedia: "Upload {{path}}"
    deleteMedia: "Delete {{path}}"

app_title: vanfontanilla.
logo:
  src: https://vanfontanilla.com/favicon.svg
site_url: https://vanfontanilla.com
show_preview_links: true

media_folder: src/images/uploads
public_folder: /images/uploads

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

media_libraries:
  default:
    config:
      max_file_size: 26214400 # 25 MB per file before resizing
      slugify_filename: true
      filename_template: "{{year}}{{month}}{{day}}-{{filename}}-{{uuid_short}}"
      # Phone photos are resized and converted to WebP in your browser before
      # upload, so the site stays fast and the repository stays small.
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 2000
          height: 2000

collections:
  # ------------------------------------------------------------------ blog
  - name: updates
    label: Life Updates
    label_singular: Life Update
    icon: photo_library
    description: Your photo blog. Add photos with captions, write a few words, then click Save to publish. The site updates in about a minute.
    folder: src/updates
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}}"
    preview_path: "updates/{{slug}}/"
    sortable_fields:
      fields: [date, title]
      default:
        field: date
        direction: descending
    thumbnail: photos.*.image
    fields:
      - name: title
        label: Title
        widget: string
        hint: "Example: Sunset surf at Urbiztondo"
      - name: date
        label: Date
        widget: datetime
        default: "{{now}}"
      - name: blocks
        label: Story blocks
        widget: list
        required: false
        collapsed: auto
        hint: "For step-by-step stories: add Text, Photo, Photo group, Video or GIF, and Quote blocks, and drag them into any order. The post shows them in exactly this order. For a quick post, leave this empty and use Photos and Story below."
        types:
          - name: text
            label: Text
            widget: object
            summary: "{{fields.text}}"
            fields:
              - { name: text, label: Text, widget: markdown }
          - name: photo
            label: Photo
            widget: object
            summary: "{{fields.caption}}"
            fields:
              - { name: image, label: Photo, widget: image, choose_url: false }
              - { name: caption, label: Caption, widget: text, required: false }
              - { name: alt, label: "Photo description (for screen readers, optional)", widget: string, required: false }
          - name: gallery
            label: Photo group (side by side)
            widget: object
            summary: Photo group
            fields:
              - name: photos
                label: Photos
                label_singular: Photo
                widget: list
                collapsed: auto
                summary: "{{fields.caption}}"
                thumbnail: image
                fields:
                  - { name: image, label: Photo, widget: image, choose_url: false }
                  - { name: caption, label: Caption, widget: text, required: false }
                  - { name: alt, label: Photo description (optional), widget: string, required: false }
          - name: video
            label: Video or GIF (link)
            widget: object
            summary: "{{fields.url}}"
            fields:
              - name: url
                label: Link
                widget: string
                hint: "YouTube, Facebook, Instagram, TikTok or Vimeo video, or an Imgur / GIPHY / Tenor GIF"
              - { name: caption, label: Caption, widget: text, required: false }
          - name: quote
            label: Quote
            widget: object
            summary: "{{fields.text}}"
            fields:
              - { name: text, label: Quote, widget: text }
              - { name: by, label: Who said it (optional), widget: string, required: false }
      - name: photos
        label: Photos
        label_singular: Photo
        widget: list
        required: false
        collapsed: auto
        summary: "{{fields.caption}}"
        thumbnail: image
        hint: Add as many as you like. Drag to reorder. The first photo is the cover.
        fields:
          - name: image
            label: Photo
            widget: image
            choose_url: false
          - name: caption
            label: Caption
            widget: text
            required: false
          - name: alt
            label: Photo description (for screen readers, optional)
            widget: string
            required: false
      - name: videos
        label: Videos & GIFs (links)
        label_singular: Video or GIF
        widget: list
        required: false
        collapsed: auto
        summary: "{{fields.url}}"
        hint: "Videos: paste a YouTube, Facebook, Instagram, TikTok or Vimeo link; it plays inside your post. GIFs: paste an Imgur, GIPHY or Tenor link; it plays silently on a loop. Upload them on those sites first; don't upload video files here."
        fields:
          - name: url
            label: Video link
            widget: string
            hint: "e.g. https://youtu.be/abc123, a Facebook/Instagram reel, a TikTok video, or a GIF like https://i.imgur.com/abc123.gifv or a giphy.com link"
          - name: caption
            label: Caption
            widget: text
            required: false
      - name: storyPosition
        label: Story position
        widget: select
        default: after
        hint: Choose "Before the photos" when your story is the introduction.
        options:
          - { label: After the photos, value: after }
          - { label: Before the photos (introduction), value: before }
      - name: body
        label: Story (optional)
        widget: markdown
        required: false
        hint: Write as much or as little as you want.
      - name: tags
        label: Tags
        label_singular: Tag
        widget: list
        required: false
        hint: "e.g. travel, family, work"
        field: { name: tag, label: Tag, widget: string }
      - name: draft
        label: Hide from site (draft)
        widget: boolean
        required: false
        default: false

  # ------------------------------------------------------------ site content
  - name: content
    label: Status, Profile & Resume
    icon: account_circle
    description: Set your status, change your profile photo and contact links, update your resume, and edit site settings.
    files:
      - name: profile
        label: Status, Profile Photo & Contacts
        file: src/_data/profile.json
        fields:
          - name: status
            label: Status (home page)
            widget: select
            default: open
            hint: Busy and On vacation hide the Hire me button (it opens your Contact page, which links to your resume).
            options:
              - { label: Open to opportunities, value: open }
              - { label: Busy, value: busy }
              - { label: On vacation, value: vacation }
          - name: jobTypes
            label: Job preference (shown when Open to opportunities)
            widget: select
            multiple: true
            required: false
            default: [full-time, part-time]
            options:
              - { label: Full-time, value: full-time }
              - { label: Part-time, value: part-time }
          - name: statusNote
            label: Status note (optional)
            widget: string
            required: false
            hint: "e.g. Available for weekend projects, or Back on December 2"
          - name: photo
            label: Profile photo
            widget: image
            choose_url: false
            hint: "Shown in the circle on the home page and in link previews. A square photo (at least 600 × 600) looks best."
          - name: photoPosition
            label: Photo position in the circle
            widget: select
            default: center
            hint: If the top of your head is cut off, choose Top.
            options:
              - { label: Center, value: center }
              - { label: Top, value: top }
              - { label: Bottom, value: bottom }
          - { name: name, label: Full name, widget: string }
          - name: shortName
            label: Short name (wordmark & logo)
            widget: string
            hint: "Shown as the big wordmark on the home page: the first word is light, the rest bold, e.g. van**fontanilla**."
          - { name: role, label: Job title, widget: string }
          - name: taglines
            label: Ribbon words (moving banner on the home page)
            label_singular: Word
            widget: list
            required: false
            field: { name: tagline, label: Word or phrase, widget: string }
          - name: featuredText
            label: Current role description (home page)
            widget: text
            required: false
            hint: Your current job title and workplace come from the Resume section.
          - { name: summary, label: About me / summary, widget: text }
          - { name: location, label: Location, widget: string }
          - { name: email, label: Email, widget: string }
          - name: phone
            label: Phone (leave empty to keep it private)
            widget: string
            required: false
          - name: resumeFile
            label: Resume PDF (for the View / download PDF button)
            widget: file
            required: false
            accept: application/pdf
            choose_url: false
            media_folder: /src/files
            public_folder: /files
            hint: Upload a new PDF here whenever you update your resume.
          - name: contacts
            label: Contact & social links (Contact page)
            label_singular: Link
            widget: list
            required: false
            collapsed: auto
            summary: "{{fields.platform}} · {{fields.handle}}"
            hint: Add Facebook, your Facebook Page, Instagram, Steam, and anything else. Drag to reorder. The first five with a link also show as icons on the home page.
            fields:
              - name: platform
                label: Platform
                widget: select
                default: facebook
                options:
                  - { label: Facebook, value: facebook }
                  - { label: Facebook Page, value: facebook-page }
                  - { label: Instagram, value: instagram }
                  - { label: LinkedIn, value: linkedin }
                  - { label: Steam, value: steam }
                  - { label: TikTok, value: tiktok }
                  - { label: YouTube, value: youtube }
                  - { label: X (Twitter), value: x }
                  - { label: Discord, value: discord }
                  - { label: Messenger, value: messenger }
                  - { label: WhatsApp, value: whatsapp }
                  - { label: Viber, value: viber }
                  - { label: Telegram, value: telegram }
                  - { label: GitHub, value: github }
                  - { label: Website, value: website }
                  - { label: Other, value: other }
              - name: handle
                label: Name or username (shown on the card)
                widget: string
                required: false
                hint: "e.g. @vanfontanilla, or the name of your Facebook Page. For Other, this is the card's title."
              - name: url
                label: Link
                widget: string
                required: false
                hint: "Full link, e.g. https://www.facebook.com/yourname. Leave empty to show the username with a Copy button instead (handy for Discord or a Steam friend code)."
          - name: highlights
            label: Highlight numbers (Current Role card)
            label_singular: Highlight
            widget: list
            required: false
            summary: "{{fields.value}} {{fields.label}}"
            fields:
              - { name: value, label: Number, widget: string }
              - { name: label, label: Label, widget: string }
          - name: services
            label: What I do (home page)
            label_singular: Card
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: description, label: Description, widget: text }
              - name: icon
                label: Icon
                widget: select
                default: star
                options:
                  - { label: Network, value: network }
                  - { label: Data / charts, value: data }
                  - { label: Database / QA, value: qa }
                  - { label: Design, value: design }
                  - { label: Tech support, value: support }
                  - { label: Code, value: code }
                  - { label: Star, value: star }

          - name: interests
            label: Interests (home page)
            label_singular: Interest
            widget: list
            required: false
            collapsed: auto
            summary: "{{fields.name}}"
            hint: Add as many as you like and drag to reorder.
            fields:
              - { name: name, label: Interest, widget: string, hint: "e.g. Gaming, Gym, Travel" }
              - name: icon
                label: Icon
                widget: select
                default: star
                options:
                  - { label: Gaming (controller), value: gaming }
                  - { label: Gym (dumbbell), value: gym }
                  - { label: Travel (plane), value: travel }
                  - { label: Coffee, value: coffee }
                  - { label: Photography (camera), value: camera }
                  - { label: Music, value: music }
                  - { label: Reading (book), value: book }
                  - { label: Movies (film), value: film }
                  - { label: Hiking (mountain), value: mountain }
                  - { label: Beach / Surfing (waves), value: wave }
                  - { label: Food, value: food }
                  - { label: Pets (paw), value: paw }
                  - { label: Cycling (bike), value: bike }
                  - { label: Tech (code), value: code }
                  - { label: Heart, value: heart }
                  - { label: Star, value: star }

      - name: resume
        label: Resume
        file: src/_data/resume.json
        fields:
          - name: experience
            label: Work experience (newest first)
            label_singular: Job
            widget: list
            summary: "{{fields.role}} · {{fields.organization}} ({{fields.start}}–{{fields.end}})"
            fields:
              - { name: role, label: Role, widget: string }
              - { name: organization, label: Organization, widget: string }
              - { name: start, label: Start year, widget: string }
              - { name: end, label: End year (or Present), widget: string }
              - name: responsibilities
                label: Key responsibilities
                label_singular: Responsibility
                widget: list
                required: false
                field: { name: item, label: Responsibility, widget: text }
          - name: education
            label: Education
            label_singular: School
            widget: list
            summary: "{{fields.school}}"
            fields:
              - { name: school, label: School, widget: string }
              - { name: credential, label: Degree / level, widget: string }
              - { name: year, label: Year, widget: string, hint: "e.g. Graduated 2016" }
          - name: certifications
            label: Certifications
            label_singular: Certification
            widget: list
            required: false
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: Certificate, widget: string }
              - { name: issuer, label: Issued by, widget: string }
              - { name: year, label: Year completed, widget: string }
          - name: skills
            label: Skills
            widget: object
            fields:
              - name: professional
                label: Professional skills
                widget: list
                field: { name: skill, label: Skill, widget: string }
              - name: tools
                label: Tools & technologies
                widget: list
                required: false
                hint: The first six also appear on the home page's Current Role card.
                field: { name: skill, label: Skill, widget: string }
              - name: soft
                label: Soft skills
                widget: list
                field: { name: skill, label: Skill, widget: string }
          - name: languages
            label: Languages
            label_singular: Language
            widget: list
            summary: "{{fields.name}} ({{fields.level}}/5)"
            fields:
              - { name: name, label: Language, widget: string }
              - { name: level, label: Level (1–5), widget: number, value_type: int, min: 1, max: 5, default: 3 }

      - name: settings
        label: Site Settings
        file: src/_data/site.json
        fields:
          - { name: title, label: "Site title (shown in the browser tab)", widget: string }
          - { name: description, label: Site description (for Google & link previews), widget: text }
          - { name: updatesTitle, label: Blog name, widget: string, default: Life Updates }
          - { name: updatesIntro, label: Blog intro, widget: text }
          - { name: language, label: Language code, widget: hidden, default: en }
          - { name: timezone, label: Time zone, widget: hidden, default: Asia/Manila }
